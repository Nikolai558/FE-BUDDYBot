# Runs the published image from GitHub Container Registry. Update with:
#   docker compose pull && docker compose up -d
# To roll back, change "latest" to an older "sha-xxxxxxx" tag (see the package page on GitHub) and run "up -d" again.
services:
  febuddybot:
    image: ghcr.io/nikolai558/fe-buddybot:latest
    container_name: febuddybot
    restart: unless-stopped
    # Secrets: copy bot.env.example to bot.env next to this file and fill it in. See Docs/Deployment.md for permissions.
    env_file: bot.env
    volumes:
      # The container runs as a non-root user (UID 1654); these folders must be owned by it:
      #   sudo chown -R 1654 data logs
      - ./data:/app/data
      - ./logs:/app/logs
      # GitHub App private key (read-only). Only needed for issue reporting:
      #   sudo chown 1654 secrets/github-app.pem && sudo chmod 400 secrets/github-app.pem
      - ./secrets:/app/secrets:ro
    # Hardening: the image can't be changed at runtime, and the process gets no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Resource caps: a leak or runaway loop kills and restarts only this container, instead of
    # starving the rest of the server (SSH, Docker, other services). Normal use is under 100 MB.
    mem_limit: 512m
    pids_limit: 200
    # "monitoring" is shared with Uptime Kuma, so the heartbeat reaches http://uptime-kuma:3001
    # without leaving the server. Create it once with: docker network create monitoring
    networks: [default, monitoring]

networks:
  monitoring:
    external: true
