# Runs the published image from GitHub Container Registry. Update with:
#   docker compose pull && docker compose up -d
# To roll back, change "latest" to an older "sha-xxxxxxx" tag (see the package page on GitHub) and run "up -d" again.
services:
  febuddybot:
    image: ghcr.io/nikolai558/fe-buddybot:latest
    container_name: febuddybot
    restart: unless-stopped
    # Secrets: copy bot.env.example to bot.env next to this file and fill it in. Keep bot.env readable by root only.
    env_file: bot.env
    volumes:
      # The container runs as a non-root user (UID 1654); these folders must be writable by it:
      #   sudo chown -R 1654:1654 data logs
      - ./data:/app/data
      - ./logs:/app/logs
